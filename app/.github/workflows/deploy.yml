name: Build and deploy

# Requires these repo secrets (see deploy/DEPLOYMENT.md):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#   ECR_REPOSITORY_URL, EC2_INSTANCE_ID
# The IAM user behind the access keys only needs: ecr:* on the one repo,
# and ssm:SendCommand / ssm:GetCommandInvocation on the one instance —
# don't reuse account-admin keys here.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REPO: ${{ secrets.ECR_REPOSITORY_URL }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REPO:$TAG" -t "$REPO:latest" .
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"

      - name: Redeploy on the EC2 instance via SSM (no SSH key needed)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Redeploy cis from GitHub Actions" \
            --parameters 'commands=["cd /opt/app && docker compose pull && docker compose up -d"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
